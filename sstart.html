<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Select World</title>

<link rel="preload" as="image" href="assets/background/panorama_equirect.png">
<link rel="preload" as="image" href="assets/background/panorama_0.png">
<link rel="preload" as="image" href="assets/background/panorama_1.png">
<link rel="preload" as="image" href="assets/background/panorama_2.png">
<link rel="preload" as="image" href="assets/background/panorama_3.png">
<link rel="preload" as="image" href="assets/background/panorama_4.png">
<link rel="preload" as="image" href="assets/background/panorama_5.png">
<link rel="preload" as="image" href="assets/background/menu_list_background.png">
<link rel="preload" as="image" href="assets/icon/world_selection/unknown_server.png">
<link rel="preload" as="audio" href="assets/sound/click.ogg">

<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/pano.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/textfield.css">
<link rel="stylesheet" href="css/slider.css">
<link rel="stylesheet" href="css/object_select_list.css">
<link rel="stylesheet" href="css/world_select.css">

<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  body {
    color: #fff;
    font-family: 'Minecraft', monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
    position: relative;
  }

  .world-screen {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) scale(var(--ui-scale, 1));
    transform-origin: top center;
    width:  calc(100vw / var(--ui-scale, 1));
    height: calc(100vh / var(--ui-scale, 1));
    display: flex;
    flex-direction: column;
    z-index: 1;
    overflow: hidden;
  }

  .world-header {
    flex: 0 0 49px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    box-sizing: border-box;
  }

  .world-title {
    font-family: 'Minecraft', monospace;
    font-size: var(--font-size, 10px);
    line-height: 1;
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    white-space: nowrap;
    user-select: none;
  }

  .world-search-wrap { display: flex; justify-content: center; }
  .world-search-wrap .mc-input { width: 200px; height: 20px; }

  .world-content {
    flex: 1 1 auto;
    min-height: 0;
    background-image: url('assets/background/menu_list_background.png');
    background-repeat: repeat;
    background-size: 32px 32px;
    image-rendering: pixelated;
  }

  .world-footer {
    flex: 0 0 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    box-sizing: border-box;
  }

  .footer-row {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  #pano-cover { background: rgba(0, 0, 0, 0.35); }
</style>

<script src="js/exit.js"></script>
</head>
<body>

<audio id="sfx-click" src="assets/sound/click.ogg" preload="auto"></audio>
<script src="js/clicksound.js"></script>

<canvas id="pano-canvas"></canvas>
<div id="pano-css"></div>
<div id="pano-cover"></div>

<div class="world-screen">

  <div class="world-header">
    <div class="world-title" data-i18n="selectWorld.title">Select World</div>
    <div class="world-search-wrap">
      <input class="mc-input search-hint" id="world-search" type="text"
             data-i18n-placeholder="gui.selectWorld.search" placeholder="Search...">
    </div>
  </div>

  <div class="world-content mc-scroll mc-list" id="world-list"></div>

  <div class="world-footer">
    <div class="footer-row">
      <button class="mcbtn mcbtn-150" id="btn-play"     disabled data-i18n="selectWorld.select">Play Selected World</button>
      <button class="mcbtn mcbtn-150" id="btn-create"              data-i18n="selectWorld.create">Create New World</button>
    </div>
    <div class="footer-row">
      <button class="mcbtn mcbtn-71" id="btn-edit"     disabled data-i18n="selectWorld.edit">Edit</button>
      <button class="mcbtn mcbtn-71" id="btn-delete"   disabled data-i18n="selectWorld.delete">Delete</button>
      <button class="mcbtn mcbtn-71" id="btn-recreate" disabled data-i18n="selectWorld.recreate">Recreate</button>
      <a class="mcbtn mcbtn-71" id="btn-back" href="index.html" data-i18n="gui.back">Back</a>
    </div>
  </div>

</div>

<script src="js/show_background.js"></script>
<script src="js/uiscale.js"></script>
<script src="js/i18n.js"></script>

<script>
(function() {
  'use strict';

  var DEFAULT_ICON = 'assets/icon/world_selection/unknown_server.png';

  /* ==========================================================
     世界列表数据
     字段（对照 WorldListEntry 三行文字）：
       name        第一行：世界名（summary.getLevelName()）
       folder      第二行前半：levelId（summary.getLevelId()）
       lastPlayed  第二行后半：日期（summary.getLastPlayed()）
       info        第三行：游戏模式（summary.getInfo()）
       icon        自定义图标（dataURL / URL），留空用 unknown_server
       join        'join' / 'marked_join' / ''
       alert       'warning' / 'error' / ''
       handle      onJoin / onEdit / onDelete / onRecreate / onAlertClick
     ========================================================== */
  var WORLDS = [
    {
      name: 'New World',
      folder: 'New World',
      lastPlayed: '2025-01-15',
      info: 'Survival',
      join: 'join',
      onJoin:     function() { alert('join: ' + this.name); },
      onEdit:     function() { console.log('edit:', this.name); },
      onDelete:   function() { console.log('delete:', this.name); },
      onRecreate: function() { console.log('recreate:', this.name); }
    },
    {
      name: 'My Survival',
      folder: 'My Survival',
      lastPlayed: '2025-02-03',
      info: 'Survival',
      join: 'marked_join',
      onJoin:     function() { alert('join: ' + this.name); },
      onEdit:     function() { console.log('edit:', this.name); },
      onDelete:   function() { console.log('delete:', this.name); },
      onRecreate: function() { console.log('recreate:', this.name); }
    },
    {
      name: 'Creative Build',
      folder: 'Creative Build',
      lastPlayed: '2025-03-01',
      info: 'Creative',
      join: 'join',
      alert: 'warning',
      onJoin:       function() { alert('join: ' + this.name); },
      onEdit:       function() { console.log('edit:', this.name); },
      onDelete:     function() { console.log('delete:', this.name); },
      onRecreate:   function() { console.log('recreate:', this.name); },
      onAlertClick: function() { console.log('warning:', this.name); }
    },
    {
      name: 'Hardcore Run',
      folder: 'Hardcore Run',
      lastPlayed: '2025-03-10',
      info: 'Hardcore',
      join: 'marked_join',
      alert: 'warning',
      onAlertClick: function() { console.log('warning:', this.name); }
    },
    {
      name: 'Broken World',
      folder: 'Broken World',
      lastPlayed: '2024-12-01',
      info: '???',
      alert: 'error',
      onDelete:     function() { console.log('delete:', this.name); },
      onAlertClick: function() { console.log('error:', this.name); }
    }
  ];

  var listEl      = document.getElementById('world-list');
  var searchBox   = document.getElementById('world-search');
  var btnPlay     = document.getElementById('btn-play');
  var btnEdit     = document.getElementById('btn-edit');
  var btnDelete   = document.getElementById('btn-delete');
  var btnRecreate = document.getElementById('btn-recreate');
  var btnCreate   = document.getElementById('btn-create');

  var selected = null;

  function callHandle(world, name) {
    if (!world) return;
    var fn = world[name];
    if (typeof fn === 'function') fn.call(world);
  }

  function updateButtonState(world) {
    selected = world || null;
    var isError = selected && selected.alert === 'error';

    btnPlay.disabled     = !selected || isError;
    btnEdit.disabled     = !selected;
    btnDelete.disabled   = !selected;
    btnRecreate.disabled = !selected || isError;
  }

  /* ==========================================================
     生成世界条目（三行文字，对照源码）
     ========================================================== */
  function createEntry(world) {
    var el = document.createElement('div');
    el.className = 'mc-list-entry world-entry';
    el._data = world;

    /* --- 图标 + 状态叠加 --- */
    var iconWrap = document.createElement('div');
    iconWrap.className = 'world-icon-wrap';

    var iconEl = document.createElement('div');
    iconEl.className = 'world-icon';
    iconEl.style.backgroundImage =
      'url("' + String(world.icon || DEFAULT_ICON).replace(/"/g, '\\"') + '")';
    iconWrap.appendChild(iconEl);

    var statusEl = document.createElement('div');
    statusEl.className = 'world-status';

    var joinEl = document.createElement('div');
    joinEl.className = 'world-join';
    if (world.join) joinEl.dataset.join = world.join;

    joinEl.addEventListener('click', function(e) {
      e.stopPropagation();
      setSelected(el);
      if (world.alert === 'error') return;
      callHandle(world, 'onJoin');
    });

    var alertEl = document.createElement('div');
    alertEl.className = 'world-alert';
    if (world.alert) alertEl.dataset.alert = world.alert;

    alertEl.addEventListener('mouseenter', function() {
      if (world.alert === 'error') return;
      if (!world.join) return;
      var hi = (world.join === 'marked_join')
        ? 'assets/icon/world_selection/marked_join_highlighted.png'
        : 'assets/icon/world_selection/join_highlighted.png';
      joinEl.style.backgroundImage = 'url("' + hi + '")';
    });
    alertEl.addEventListener('mouseleave', function() {
      joinEl.style.backgroundImage = '';
    });

    alertEl.addEventListener('click', function(e) {
      e.stopPropagation();
      setSelected(el);
      callHandle(world, 'onAlertClick');
      if (world.alert === 'error') return;
      callHandle(world, 'onJoin');
    });

    statusEl.appendChild(joinEl);
    statusEl.appendChild(alertEl);
    iconWrap.appendChild(statusEl);

    /* --- 三行文字 --- */
    var infoEl = document.createElement('div');
    infoEl.className = 'world-info';

    /* 第一行：世界名 */
    var nameEl = document.createElement('div');
    nameEl.className = 'world-name';
    nameEl.textContent = world.name || '';

    /* 第二行：levelId (日期) */
    var metaEl = document.createElement('div');
    metaEl.className = 'world-meta';
    var metaText = world.folder || world.name || '';
    if (world.lastPlayed) metaText += ' (' + world.lastPlayed + ')';
    metaEl.textContent = metaText;

    /* 第三行：info */
    var infoTextEl = document.createElement('div');
    infoTextEl.className = 'world-info-text';
    infoTextEl.textContent = world.info || '';

    infoEl.appendChild(nameEl);
    infoEl.appendChild(metaEl);
    infoEl.appendChild(infoTextEl);

    el.appendChild(iconWrap);
    el.appendChild(infoEl);

    el.addEventListener('click', function() { setSelected(el); });
    el.addEventListener('dblclick', function() {
      setSelected(el);
      if (world.alert === 'error') return;
      callHandle(world, 'onJoin');
    });

    world._el = el;
    return el;
  }

  function renderList(worlds) {
    listEl.innerHTML = '';
    for (var i = 0; i < worlds.length; i++) {
      listEl.appendChild(createEntry(worlds[i]));
    }
    setSelected(null);
  }

  function setSelected(el) {
    var world = el ? el._data : null;

    var all = listEl.querySelectorAll('.world-entry');
    for (var i = 0; i < all.length; i++) {
      all[i].classList.toggle('selected', all[i] === el);
    }
    updateButtonState(world);

    if (el) {
      var elRect = listEl.getBoundingClientRect();
      var entryRect = el.getBoundingClientRect();
      var currentScroll = listEl.scrollTop;
      var entryTopInContent = entryRect.top - elRect.top + currentScroll;
      var target = entryTopInContent + entryRect.height / 2 - listEl.clientHeight / 2;
      listEl.scrollTop = Math.max(0, target);
    }
  }

  /* 搜索：源码 filterAccepts 匹配 name 和 folder */
  function applyFilter(q) {
    q = (q || '').trim().toLowerCase();
    var all = listEl.querySelectorAll('.world-entry');
    for (var i = 0; i < all.length; i++) {
      var w = all[i]._data;
      if (!w) continue;
      var name   = (w.name   || '').toLowerCase();
      var folder = (w.folder || '').toLowerCase();
      var hit = !q || name.indexOf(q) >= 0 || folder.indexOf(q) >= 0;
      all[i].style.display = hit ? '' : 'none';
    }
    setSelected(null);
  }

  btnPlay.addEventListener('click', function() {
    if (!selected) return;
    if (selected.alert === 'error') return;
    callHandle(selected, 'onJoin');
  });

  btnEdit.addEventListener('click', function() {
    if (!selected) return;
    callHandle(selected, 'onEdit');
  });

  btnDelete.addEventListener('click', function() {
    if (!selected) return;
    callHandle(selected, 'onDelete');
  });

  btnRecreate.addEventListener('click', function() {
    if (!selected) return;
    if (selected.alert === 'error') return;
    callHandle(selected, 'onRecreate');
  });

  btnCreate.addEventListener('click', function() {
    console.log('[world] create new');
  });

  searchBox.addEventListener('input', function() {
    applyFilter(searchBox.value);
  });

  renderList(WORLDS);
  updateButtonState(null);
  searchBox.focus();

  if (window.i18n && window.i18n.ready) {
    window.i18n.ready(function() {});
  }
})();
</script>

</body>
</html>
