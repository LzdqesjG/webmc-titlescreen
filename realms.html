<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Minecraft Realms</title>

<link rel="preload" as="image" href="assets/background/panorama_equirect.png">
<link rel="preload" as="image" href="assets/background/panorama_0.png">
<link rel="preload" as="image" href="assets/background/panorama_1.png">
<link rel="preload" as="image" href="assets/background/panorama_2.png">
<link rel="preload" as="image" href="assets/background/panorama_3.png">
<link rel="preload" as="image" href="assets/background/panorama_4.png">
<link rel="preload" as="image" href="assets/background/panorama_5.png">
<link rel="preload" as="image" href="assets/background/menu_list_background.png">
<link rel="preload" as="image" href="assets/icon/world_selection/unknown_server.png">
<link rel="preload" as="audio" href="assets/sound/click.ogg">
<link rel="preload" as="script" href="js/i18n.js">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/pano.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/textfield.css">
<link rel="stylesheet" href="css/slider.css">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  body {
    color: #fff;
    font-family: 'Minecraft', monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
    position: relative;
  }

  .world-screen {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) scale(var(--ui-scale, 1));
    transform-origin: top center;
    width:  calc(100vw / var(--ui-scale, 1));
    height: calc(100vh / var(--ui-scale, 1));
    display: flex;
    flex-direction: column;
    z-index: 1;
    overflow: visible;
  }

  /* ============ Header ============ */
  .world-header {
    flex: 0 0 49px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    box-sizing: border-box;
  }

  .world-title {
    font-family: 'Minecraft', monospace;
    font-size: 20px;
    line-height: 1;
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    white-space: nowrap;
    user-select: none;
  }

  .world-search-wrap { display: flex; justify-content: center; }
  .world-search-wrap .mc-input { width: 200px; height: 20px; }

  /* ============ Content ============ */
  .world-content {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    background-image: url('assets/background/menu_list_background.png');
    background-repeat: repeat;
    background-size: 32px 32px;
    image-rendering: pixelated;
  }

  .world-list { display: flex; flex-direction: column; }

  /* 空状态提示 */
  .world-empty {
    padding: 12px 8px 4px;
    font-family: 'Minecraft', monospace;
    font-size: 16px;
    line-height: 1;
    color: #909090;
    text-shadow: 1px 1px 0 #1a1a1a;
    user-select: none;
  }

  /* ============ Realm 条目 ============ */
  .world-entry {
    display: flex;
    flex-direction: row;
    align-items: center;
    height: 36px;
    padding: 0 4px;
    box-sizing: border-box;
    cursor: pointer;
    user-select: none;
    gap: 4px;
  }

  .world-entry:hover { background: rgba(255, 255, 255, 0.08); }

  .world-entry.selected {
    background: rgba(255, 255, 255, 0.16);
    box-shadow: inset 0 0 0 1px #ffffff;
  }

  /* ============ 图标 32×32 ============ */
  .world-icon-wrap {
    position: relative;
    flex: 0 0 32px;
    width: 32px;
    height: 32px;
  }

  .world-icon {
    position: absolute;
    inset: 0;
    background-image: url('assets/icon/world_selection/unknown_server.png');
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    image-rendering: pixelated;
  }

  /* ============ 状态叠加 ============ */
  .world-status {
    position: absolute;
    inset: 0;
  }

  .world-join {
    position: absolute;
    inset: 0;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
    image-rendering: pixelated;
    display: none;
    cursor: pointer;
    z-index: 1;
  }

  .world-alert {
    position: absolute;
    top: 0;
    left: 0;
    width: 16px;
    height: 16px;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
    image-rendering: pixelated;
    display: none;
    cursor: pointer;
    z-index: 2;
  }

  .world-alert[data-alert="warning"] {
    display: block;
    background-image: url('assets/icon/world_selection/warning.png');
  }
  .world-alert[data-alert="error"] {
    display: block;
    background-image: url('assets/icon/world_selection/error.png');
  }

  .world-alert[data-alert="warning"]:hover {
    background-image: url('assets/icon/world_selection/warning_highlighted.png');
  }
  .world-alert[data-alert="error"]:hover {
    background-image: url('assets/icon/world_selection/error_highlighted.png');
  }

  /* ============ 箭头显示 / 高亮 ============ */

  .world-entry:hover .world-join,
  .world-entry.selected .world-join {
    display: block;
  }

  .world-entry:hover .world-join[data-join="join"],
  .world-entry.selected .world-join[data-join="join"] {
    background-image: url('assets/icon/world_selection/join.png');
  }
  .world-entry:hover .world-join[data-join="marked_join"],
  .world-entry.selected .world-join[data-join="marked_join"] {
    background-image: url('assets/icon/world_selection/marked_join.png');
  }

  .world-entry .world-join[data-join="join"]:hover {
    background-image: url('assets/icon/world_selection/join_highlighted.png');
  }
  .world-entry .world-join[data-join="marked_join"]:hover {
    background-image: url('assets/icon/world_selection/marked_join_highlighted.png');
  }

  /* ============ 文字区 ============ */
  .world-info {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }

  .world-name {
    font-family: 'Minecraft', monospace;
    font-size: 20px;
    line-height: 1;
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .world-meta {
    font-family: 'Minecraft', monospace;
    font-size: 16px;
    line-height: 1;
    color: #808080;
    text-shadow: 1px 1px 0 #1a1a1a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ============ Footer ============ */
  .world-footer {
    flex: 0 0 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    box-sizing: border-box;
  }

  .footer-row {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  #pano-cover { background: rgba(0, 0, 0, 0.35); }
</style>

<script src="js/exit.js"></script>
</head>
<body>

<audio id="sfx-click" src="assets/sound/click.ogg" preload="auto"></audio>
<script src="js/clicksound.js"></script>

<canvas id="pano-canvas"></canvas>
<div id="pano-css"></div>
<div id="pano-cover"></div>

<div class="world-screen">

  <div class="world-header">
    <div class="world-title" data-i18n="realms.title">Minecraft Realms</div>
    <div class="world-search-wrap">
      <input class="mc-input" id="realm-search" type="text"
             data-i18n-placeholder="realms.search" placeholder="Search...">
    </div>
  </div>

  <div class="world-content mc-scroll">
    <div class="world-list" id="realm-list"></div>
  </div>

  <div class="world-footer">
    <div class="footer-row">
      <button class="mcbtn mcbtn-150" id="btn-configure" disabled data-i18n="realms.configure">Configure Realm</button>
      <button class="mcbtn mcbtn-150" id="btn-leave"     disabled data-i18n="realms.leave">Leave Realm</button>
    </div>
    <div class="footer-row">
      <button class="mcbtn mcbtn-150" id="btn-buy" data-i18n="realms.buy">Buy a Realm</button>
      <a class="mcbtn mcbtn-150" id="btn-back" href="index.html" data-i18n="realms.back">Back</a>
    </div>
  </div>

</div>

<script src="js/show_background.js"></script>
<script src="js/uiscale.js"></script>
<script src="js/i18n.js"></script>
<script src="js/slider.js"></script>
<script>
(function() {
  'use strict';

  var DEFAULT_ICON = 'assets/icon/world_selection/unknown_server.png';

  /* ==========================================================
     Realm 列表

     说明：Realms 需要在线账号与官方服务，纯静态站点无法真正
     联机，因此这里放示例条目演示列表交互；「配置 / 离开 / 购买」
     等动作目前仅为 console 占位。
     ========================================================== */
  var REALMS = [
    {
      icon: DEFAULT_ICON,
      name: '我的 Realm',
      description: 'Minecraft 1.21.4 · 在线',
      join: 'join',
      onJoin: function() { console.log('[realms] open My Realm'); }
    },
    {
      icon: DEFAULT_ICON,
      name: '朋友的 Realm',
      description: '已过期 · 需要续订',
      join: 'join',
      alert: 'error',
      onJoin: function() { console.log('[realms] open Friend\'s Realm'); }
    }
  ];

  var listEl       = document.getElementById('realm-list');
  var searchBox    = document.getElementById('realm-search');
  var btnConfigure = document.getElementById('btn-configure');
  var btnLeave     = document.getElementById('btn-leave');
  var btnBuy       = document.getElementById('btn-buy');

  function callHandle(realm, name) {
    if (!realm) return;
    var fn = realm[name];
    if (typeof fn === 'function') fn.call(realm);
  }

  function getJoinHighlighted(realm) {
    return (realm.join === 'marked_join')
      ? 'assets/icon/world_selection/marked_join_highlighted.png'
      : 'assets/icon/world_selection/join_highlighted.png';
  }

  /* ==========================================================
     生成 Realm 条目
     ========================================================== */
  function createEntry(realm) {
    var el = document.createElement('div');
    el.className = 'world-entry';

    /* 图标 */
    var iconWrap = document.createElement('div');
    iconWrap.className = 'world-icon-wrap';

    var iconEl = document.createElement('div');
    iconEl.className = 'world-icon';
    iconEl.style.backgroundImage =
      'url("' + String(realm.icon || DEFAULT_ICON).replace(/"/g, '\\"') + '")';
    iconWrap.appendChild(iconEl);

    /* 状态容器 */
    var statusEl = document.createElement('div');
    statusEl.className = 'world-status';

    /* 箭头 */
    var joinEl = document.createElement('div');
    joinEl.className = 'world-join';
    if (realm.join) joinEl.dataset.join = realm.join;

    joinEl.addEventListener('click', function(e) {
      e.stopPropagation();
      setSelected(realm);
      if (realm.alert === 'error') return;
      callHandle(realm, 'onJoin');
    });

    /* 警告 */
    var alertEl = document.createElement('div');
    alertEl.className = 'world-alert';
    if (realm.alert) alertEl.dataset.alert = realm.alert;

    alertEl.addEventListener('mouseenter', function() {
      if (realm.alert === 'error') return;
      if (!realm.join) return;
      joinEl.style.backgroundImage = 'url("' + getJoinHighlighted(realm) + '")';
    });
    alertEl.addEventListener('mouseleave', function() {
      joinEl.style.backgroundImage = '';
    });

    alertEl.addEventListener('click', function(e) {
      e.stopPropagation();
      setSelected(realm);
      callHandle(realm, 'onAlertClick');
      if (realm.alert === 'error') return;
      callHandle(realm, 'onJoin');
    });

    statusEl.appendChild(joinEl);
    statusEl.appendChild(alertEl);
    iconWrap.appendChild(statusEl);

    /* 文字 */
    var infoEl = document.createElement('div');
    infoEl.className = 'world-info';

    var nameEl = document.createElement('div');
    nameEl.className = 'world-name';
    nameEl.textContent = realm.name || '';

    var descEl = document.createElement('div');
    descEl.className = 'world-meta';
    descEl.textContent = realm.description || '';

    infoEl.appendChild(nameEl);
    infoEl.appendChild(descEl);

    el.appendChild(iconWrap);
    el.appendChild(infoEl);

    /* 单击选中 */
    el.addEventListener('click', function() {
      setSelected(realm);
    });

    /* 双击进入 */
    el.addEventListener('dblclick', function() {
      setSelected(realm);
      if (realm.alert === 'error') return;
      callHandle(realm, 'onJoin');
    });

    realm._el = el;
    return el;
  }

  function renderList() {
    listEl.innerHTML = '';

    if (!REALMS.length) {
      var empty = document.createElement('div');
      empty.className = 'world-empty';
      empty.setAttribute('data-i18n', 'realms.empty');
      empty.textContent = "You don't have any Realms yet";
      listEl.appendChild(empty);
      applyI18nTo(empty);
      selected = null;
      updateButtonState();
      return;
    }

    for (var i = 0; i < REALMS.length; i++) {
      listEl.appendChild(createEntry(REALMS[i]));
    }
    selected = null;
    updateButtonState();
  }

  /* 动态生成的内容在 i18n 就绪后补应用一次翻译 */
  function applyI18nTo(el) {
    if (!window.i18n || !window.i18n.t) return;
    var key = el.getAttribute && el.getAttribute('data-i18n');
    if (key) el.textContent = window.i18n.t(key);
  }

  /* ==========================================================
     选中状态
     ========================================================== */
  var selected = null;

  function setSelected(realm) {
    selected = realm || null;

    for (var i = 0; i < REALMS.length; i++) {
      var r = REALMS[i];
      if (r._el) r._el.classList.toggle('selected', r === selected);
    }
    updateButtonState();
  }

  function updateButtonState() {
    var active  = !!selected;
    var isError = active && selected.alert === 'error';

    btnConfigure.disabled = !active || isError;
    btnLeave.disabled     = !active || isError;
  }

  /* ==========================================================
     搜索
     ========================================================== */
  function applyFilter(q) {
    q = (q || '').trim().toLowerCase();
    for (var i = 0; i < REALMS.length; i++) {
      var r = REALMS[i];
      if (!r._el) continue;
      var hay = ((r.name || '') + ' ' + (r.description || '')).toLowerCase();
      var hit = !q || hay.indexOf(q) >= 0;
      r._el.style.display = hit ? '' : 'none';
    }
    setSelected(null);
  }

  /* ==========================================================
     底部按钮
     ========================================================== */
  btnConfigure.addEventListener('click', function() {
    if (!selected) return;
    callHandle(selected, 'onConfigure');
  });

  btnLeave.addEventListener('click', function() {
    if (!selected) return;
    callHandle(selected, 'onLeave');
  });

  btnBuy.addEventListener('click', function() {
    console.log('[realms] buy a realm');
  });

  searchBox.addEventListener('input', function() {
    applyFilter(searchBox.value);
  });

  /* 启动 */
  renderList();
  updateButtonState();

  /* i18n 就绪后重绘（动态内容） */
  if (window.i18n && window.i18n.ready) {
    window.i18n.ready(function() { renderList(); });
  }
  document.addEventListener('i18n-ready', function() { renderList(); });
})();
</script>

</body>
</html>
