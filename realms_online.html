<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Minecraft Realms</title>

<link rel="preload" as="image" href="assets/background/panorama_equirect.png">
<link rel="preload" as="image" href="assets/background/panorama_0.png">
<link rel="preload" as="image" href="assets/background/panorama_1.png">
<link rel="preload" as="image" href="assets/background/panorama_2.png">
<link rel="preload" as="image" href="assets/background/panorama_3.png">
<link rel="preload" as="image" href="assets/background/panorama_4.png">
<link rel="preload" as="image" href="assets/background/panorama_5.png">
<link rel="preload" as="image" href="assets/background/menu_list_background.png">
<link rel="preload" as="image" href="assets/logo/realms.png">
<link rel="preload" as="image" href="assets/icon/invite.png">
<link rel="preload" as="image" href="assets/icon/news.png">
<link rel="preload" as="image" href="assets/notification/1.png">
<link rel="preload" as="image" href="assets/popup/background.png">
<link rel="preload" as="audio" href="assets/sound/click.ogg">
<link rel="preload" as="script" href="js/i18n.js">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/pano.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/textfield.css">
<link rel="stylesheet" href="css/slider.css">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  body {
    color: #fff;
    font-family: 'Minecraft', monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
    position: relative;
  }

  .world-screen {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) scale(var(--ui-scale, 1));
    transform-origin: top center;
    width:  calc(100vw / var(--ui-scale, 1));
    height: calc(100vh / var(--ui-scale, 1));
    display: flex;
    flex-direction: column;
    z-index: 1;
    overflow: visible;
  }

  /* ============ Header（Spacer90 | Logo(128×34) | 90×44 按钮组） ============ */
  .world-header {
    flex: 0 0 44px;
    display: grid;
    grid-template-columns: 90px 1fr 90px;
    align-items: center;
    box-sizing: border-box;
    box-shadow: 0 1px 0 rgba(0,0,0,0.55);
  }

  /* realms.png 512×256 → 官方 blit：目标 128×34、源切片 128×64。
     即把整图缩到 128×64，取顶部 34px（对应源像素 y 0..136，
     正好覆盖 logo 内容 bbox y=0..137）。 */
  .realms-logo {
    justify-self: center;
    width: 128px;
    height: 34px;
    background-image: url('assets/logo/realms.png');
    background-repeat: no-repeat;
    background-size: 128px 64px;
    background-position: 0 0;
    image-rendering: pixelated;
    pointer-events: none;
  }

  .realms-header-buttons {
    justify-self: center;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* 通知按钮（20×20，内含 14×14 图标 + 右上角 8×8 角标） */
  .notice-btn {
    position: relative;
    overflow: visible;
  }

  .notice-badge {
    position: absolute;
    right: -3px;
    top: -3px;
    width: 8px;
    height: 8px;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    image-rendering: pixelated;
    pointer-events: none;
    display: none;
  }
  .notice-btn[data-badge] .notice-badge { display: block; }

  /* ============ Content ============ */
  .world-content {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    background-image: url('assets/background/menu_list_background.png');
    background-repeat: repeat;
    background-size: 32px 32px;
    image-rendering: pixelated;
  }

  .world-list { display: flex; flex-direction: column; }

  /* ============ 空状态（no_realms.png 130×64 + 文本） ============ */
  .realms-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px 12px;
    box-sizing: border-box;
  }

  .realms-empty-img {
    width: 130px;
    height: 64px;
    image-rendering: pixelated;
    display: block;
  }

  .realms-empty-text {
    max-width: 308px;
    text-align: center;
    font-family: 'Minecraft', monospace;
    font-size: 16px;
    line-height: 1.3;
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    user-select: none;
  }

  /* ============ Realm 条目 ============ */
  .world-entry {
    display: flex;
    flex-direction: row;
    align-items: center;
    height: 36px;
    padding: 0 4px;
    box-sizing: border-box;
    cursor: pointer;
    user-select: none;
    gap: 4px;
  }

  .world-entry:hover { background: rgba(255, 255, 255, 0.08); }

  .world-entry.selected {
    background: rgba(255, 255, 255, 0.16);
    box-shadow: inset 0 0 0 1px #ffffff;
  }

  /* ============ 图标 32×32 ============ */
  .world-icon-wrap {
    position: relative;
    flex: 0 0 32px;
    width: 32px;
    height: 32px;
  }

  .world-icon {
    position: absolute;
    inset: 0;
    background-image: url('assets/icon/world_selection/unknown_server.png');
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    image-rendering: pixelated;
  }

  /* ============ 文字区 ============ */
  .world-info {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }

  .world-name {
    font-family: 'Minecraft', monospace;
    font-size: 20px;
    line-height: 1;
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .world-meta {
    font-family: 'Minecraft', monospace;
    font-size: 16px;
    line-height: 1;
    color: #808080;
    text-shadow: 1px 1px 0 #1a1a1a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ============ Footer（GridLayout 3 列，全部 100×20） ============ */
  .world-footer {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 11px 0;
    box-sizing: border-box;
  }

  .footer-row {
    display: flex;
    gap: 4px;
    justify-content: center;
  }

  #pano-cover { background: rgba(0, 0, 0, 0.35); }

  /* ==========================================================
     Add Realm 弹窗（AddRealmPopupScreen）
     窗口 320×172，背景 popup/background 九宫格（源 236×34，border 6）
     ========================================================== */
  .realms-popup-overlay {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.6);
  }
  .realms-popup-overlay[hidden] { display: none; }

  .realm-popup {
    position: relative;
    width: 320px;
    height: 172px;
    box-sizing: border-box;
    background: #000;
  }

  /* 九宫格背景层，铺满整个 320×172 */
  .realm-popup-bg {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    border: 6px solid transparent;
    border-image: url('assets/popup/background.png') 6 fill stretch;
    pointer-events: none;
  }

  /* 左侧轮播图：left+10, top+10，195×152 */
  .realm-popup-carousel {
    position: absolute;
    left: 10px;
    top: 10px;
    width: 195px;
    height: 152px;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
    image-rendering: pixelated;
    border: 1px solid #000;
    box-sizing: border-box;
  }

  /* 关闭按钮（14×14），left+4, top+4 */
  .realm-popup-close {
    position: absolute;
    left: 4px;
    top: 4px;
    width: 14px;
    height: 14px;
    padding: 0;
    border: none;
    background: transparent;
    background-image: url('assets/widget/cross_button.png');
    background-repeat: no-repeat;
    background-size: 100% 100%;
    image-rendering: pixelated;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .realm-popup-close:hover {
    background-image: url('assets/widget/cross_button_highlighted.png');
  }

  /* 右侧文案：right-110, top+10，宽 100 */
  .realm-popup-text {
    position: absolute;
    right: 10px;
    top: 10px;
    width: 100px;
    font-family: 'Minecraft', monospace;
    font-size: 9px;
    line-height: 1.15;
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    user-select: none;
    overflow: hidden;
  }

  /* 按钮宽 99（mcbtn-99） */
  .mcbtn-99 { width: 99px; height: 20px; }

  /* 试用按钮上的钻石动画：right-10, bottom-54；图标 8×8，位于按钮右内侧 */
  .realm-popup-trial { position: relative; }

  .trial-diamond {
    position: absolute;
    right: 12px;
    top: 6px;
    width: 8px;
    height: 8px;
    background-image: url('assets/icon/trial_available.png');
    background-repeat: no-repeat;
    background-size: 8px 48px;
    background-position: 0 0;
    image-rendering: pixelated;
    pointer-events: none;
    animation: trialDiamond 1s linear infinite;
  }

  /* trial_available.png：8×48 = 6 帧 8×8，帧时长 ticks [10,2,2,2,2,2]
     → 500ms + 100ms×5，合计 1000ms */
  @keyframes trialDiamond {
    0%, 49.99%     { background-position: 0 0; }
    50%, 59.99%    { background-position: 0 -8px; }
    60%, 69.99%    { background-position: 0 -16px; }
    70%, 79.99%    { background-position: 0 -24px; }
    80%, 89.99%    { background-position: 0 -32px; }
    90%, 100%      { background-position: 0 -40px; }
  }

  .realm-popup-trial { position: absolute; right: 10px; bottom: 54px; }
  .realm-popup-buy   { position: absolute; right: 10px; bottom: 10px; }
</style>

<script src="js/exit.js"></script>
</head>
<body>

<audio id="sfx-click" src="assets/sound/click.ogg" preload="auto"></audio>
<script src="js/clicksound.js"></script>

<canvas id="pano-canvas"></canvas>
<div id="pano-css"></div>
<div id="pano-cover"></div>

<div class="world-screen">

  <div class="world-header">
    <div class="realms-header-buttons" style="grid-column: 3; justify-self: center;">
      <button class="mcbtn mcbtn-icon notice-btn" id="btn-invites" data-badge="1"
              title="Pending Invites" data-i18n-title="mco.invites.title">
        <img src="assets/icon/invite.png" alt="">
        <span class="notice-badge" id="badge-invites"></span>
      </button>
      <button class="mcbtn mcbtn-icon notice-btn" id="btn-news"
              title="Realms news" data-i18n-title="mco.news">
        <img src="assets/icon/news.png" alt="">
        <span class="notice-badge" id="badge-news"></span>
      </button>
    </div>
    <div class="realms-logo" style="grid-column: 2; justify-self: center;"></div>
  </div>

  <div class="world-content mc-scroll">
    <div class="world-list" id="realm-list"></div>
  </div>

  <div class="world-footer">
    <div class="footer-row">
      <button class="mcbtn mcbtn-100" id="btn-play"      disabled data-i18n="mco.selectServer.play">Play</button>
      <button class="mcbtn mcbtn-100" id="btn-configure" disabled data-i18n="mco.selectServer.configure">Configure</button>
      <button class="mcbtn mcbtn-100" id="btn-renew"     disabled data-i18n="mco.selectServer.expiredRenew">Renew</button>
    </div>
    <div class="footer-row">
      <button class="mcbtn mcbtn-100" id="btn-leave" disabled data-i18n="mco.selectServer.leave">Leave Realm</button>
      <button class="mcbtn mcbtn-100" id="btn-add"            data-i18n="mco.selectServer.purchase">Add Realm</button>
      <a class="mcbtn mcbtn-100" id="btn-back" href="index.html" data-i18n="gui.back">Back</a>
    </div>
  </div>

  <!-- ===== Add Realm 弹窗 ===== -->
  <div class="realms-popup-overlay" id="realm-popup" hidden>
    <div class="realm-popup">
      <div class="realm-popup-bg"></div>
      <div class="realm-popup-carousel" id="popup-carousel"></div>
      <button class="realm-popup-close" id="popup-close" title="Close" data-i18n-title="mco.selectServer.close"></button>
      <div class="realm-popup-text" data-i18n="mco.selectServer.popup"></div>
      <button class="mcbtn mcbtn-99 realm-popup-trial" id="popup-trial">
        <span class="trial-diamond"></span>
        <span data-i18n="mco.selectServer.trial">Get a Trial!</span>
      </button>
      <button class="mcbtn mcbtn-99 realm-popup-buy" id="popup-buy" data-i18n="mco.selectServer.buy">Buy a Realm!</button>
    </div>
  </div>

</div>

<script src="js/show_background.js"></script>
<script src="js/uiscale.js"></script>
<script src="js/i18n.js"></script>
<script src="js/slider.js"></script>
<script>
(function() {
  'use strict';

  var DEFAULT_ICON = 'assets/icon/world_selection/unknown_server.png';

  /* ==========================================================
     Realm 列表

     说明：Realms 需要在线账号与官方服务，纯静态站点无法真正
     联机，因此这里放示例条目演示列表与按钮状态交互。
     state: 'open' 正常可进入 / 'expired' 需续订
     ========================================================== */
  var REALMS = [
    {
      icon: DEFAULT_ICON,
      name: 'My Realm',
      description: 'Minecraft 1.21.4 · Online',
      state: 'open'
    },
    {
      icon: DEFAULT_ICON,
      name: "Friend's Realm",
      description: 'Expired · Renew to play',
      state: 'expired'
    }
  ];

  var listEl       = document.getElementById('realm-list');
  var btnPlay      = document.getElementById('btn-play');
  var btnConfigure = document.getElementById('btn-configure');
  var btnRenew     = document.getElementById('btn-renew');
  var btnLeave     = document.getElementById('btn-leave');
  var btnAdd       = document.getElementById('btn-add');
  var btnInvites   = document.getElementById('btn-invites');
  var btnNews      = document.getElementById('btn-news');

  function tr(key, fallback) {
    if (window.i18n && window.i18n.t) {
      var v = window.i18n.t(key);
      if (v && v !== key) return v;
    }
    return fallback;
  }

  /* ==========================================================
     通知角标（invite / news）
     ========================================================== */
  function setBadge(btn, badgeEl, count) {
    if (!count || count <= 0) {
      btn.removeAttribute('data-badge');
      badgeEl.style.backgroundImage = '';
      return;
    }
    var idx = Math.min(count, 6);
    var name = (idx >= 6) ? 'more' : String(idx);
    btn.setAttribute('data-badge', String(count));
    badgeEl.style.backgroundImage = 'url("assets/notification/' + name + '.png")';
  }

  /* 静态示例：3 条待处理邀请、1 条未读资讯 */
  setBadge(btnInvites, document.getElementById('badge-invites'), 3);
  setBadge(btnNews,    document.getElementById('badge-news'),    1);

  /* ==========================================================
     生成 Realm 条目
     ========================================================== */
  function createEntry(realm) {
    var el = document.createElement('div');
    el.className = 'world-entry';

    var iconWrap = document.createElement('div');
    iconWrap.className = 'world-icon-wrap';

    var iconEl = document.createElement('div');
    iconEl.className = 'world-icon';
    iconEl.style.backgroundImage =
      'url("' + String(realm.icon || DEFAULT_ICON).replace(/"/g, '\\"') + '")';
    iconWrap.appendChild(iconEl);

    var infoEl = document.createElement('div');
    infoEl.className = 'world-info';

    var nameEl = document.createElement('div');
    nameEl.className = 'world-name';
    nameEl.textContent = realm.name || '';

    var descEl = document.createElement('div');
    descEl.className = 'world-meta';
    descEl.textContent = realm.description || '';

    infoEl.appendChild(nameEl);
    infoEl.appendChild(descEl);

    el.appendChild(iconWrap);
    el.appendChild(infoEl);

    el.addEventListener('click', function() { setSelected(realm); });
    el.addEventListener('dblclick', function() {
      setSelected(realm);
      if (realm.state === 'open') console.log('[realms] play', realm.name);
    });

    realm._el = el;
    return el;
  }

  function renderList() {
    listEl.innerHTML = '';

    if (!REALMS.length) {
      var empty = document.createElement('div');
      empty.className = 'realms-empty';

      var img = document.createElement('img');
      img.className = 'realms-empty-img';
      img.src = 'assets/realms/no_realms.png';
      img.alt = '';

      var txt = document.createElement('div');
      txt.className = 'realms-empty-text';
      txt.setAttribute('data-i18n', 'mco.selectServer.noRealms');
      txt.textContent = tr('mco.selectServer.noRealms', "You don't seem to have a Realm.");

      empty.appendChild(img);
      empty.appendChild(txt);
      listEl.appendChild(empty);

      selected = null;
      updateButtonState();
      return;
    }

    for (var i = 0; i < REALMS.length; i++) {
      var entry = createEntry(REALMS[i]);
      if (REALMS[i] === selected) entry.classList.add('selected');
      listEl.appendChild(entry);
    }
    updateButtonState();
  }

  /* ==========================================================
     选中状态
     ========================================================== */
  var selected = null;

  function setSelected(realm) {
    selected = realm || null;
    for (var i = 0; i < REALMS.length; i++) {
      var r = REALMS[i];
      if (r._el) r._el.classList.toggle('selected', r === selected);
    }
    updateButtonState();
  }

  function updateButtonState() {
    var active  = !!selected;
    var open    = active && selected.state === 'open';
    var expired = active && selected.state === 'expired';

    /* Play / Configure 仅对正常开启的 Realm 可用；
       Renew 仅对已过期的 Realm 可用；
       Leave 对任意选中的 Realm 可用（原版对过期 Realm 也会禁用 Leave） */
    btnPlay.disabled      = !open;
    btnConfigure.disabled = !open;
    btnRenew.disabled     = !expired;
    btnLeave.disabled     = !open;
  }

  /* ==========================================================
     底部按钮
     ========================================================== */
  btnPlay.addEventListener('click', function() {
    if (selected && selected.state === 'open') console.log('[realms] play', selected.name);
  });
  btnConfigure.addEventListener('click', function() {
    if (selected && selected.state === 'open') console.log('[realms] configure', selected.name);
  });
  btnRenew.addEventListener('click', function() {
    if (selected && selected.state === 'expired') console.log('[realms] renew', selected.name);
  });
  btnLeave.addEventListener('click', function() {
    if (selected && selected.state === 'open') console.log('[realms] leave', selected.name);
  });
  btnInvites.addEventListener('click', function() { console.log('[realms] pending invites'); });
  btnNews.addEventListener('click',    function() { console.log('[realms] news'); });

  /* ==========================================================
     Add Realm 弹窗（AddRealmPopupScreen）
     ========================================================== */
  var CAROUSEL = [
    'assets/popup/new_world.png',
    'assets/popup/adventure.png',
    'assets/popup/snapshot_realms.png'
  ];
  var CAROUSEL_INTERVAL = 5000; /* 100 tick = 5s */

  var popup      = document.getElementById('realm-popup');
  var carouselEl = document.getElementById('popup-carousel');
  var closeBtn   = document.getElementById('popup-close');
  var trialBtn   = document.getElementById('popup-trial');
  var buyBtn     = document.getElementById('popup-buy');

  var carouselIndex = 0;
  var carouselTimer = null;

  function showCarousel() {
    carouselEl.style.backgroundImage = 'url("' + CAROUSEL[carouselIndex] + '")';
  }

  function openPopup() {
    popup.hidden = false;
    carouselIndex = 0;
    showCarousel();
    if (carouselTimer) clearInterval(carouselTimer);
    if (CAROUSEL.length > 1) {
      carouselTimer = setInterval(function() {
        carouselIndex = (carouselIndex + 1) % CAROUSEL.length;
        showCarousel();
      }, CAROUSEL_INTERVAL);
    }
  }

  function closePopup() {
    popup.hidden = true;
    if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; }
  }

  btnAdd.addEventListener('click', openPopup);
  closeBtn.addEventListener('click', closePopup);
  popup.addEventListener('click', function(e) { if (e.target === popup) closePopup(); });
  trialBtn.addEventListener('click', function() { console.log('[realms] get a trial'); });
  buyBtn.addEventListener('click',   function() { console.log('[realms] buy a realm'); });

  /* ==========================================================
     启动 & i18n 补翻译
     ========================================================== */
  function applyI18nTitles() {
    var nodes = document.querySelectorAll('[data-i18n-title]');
    for (var i = 0; i < nodes.length; i++) {
      var k = nodes[i].getAttribute('data-i18n-title');
      if (k) nodes[i].title = tr(k, nodes[i].title);
    }
    var txt = document.querySelector('.realm-popup-text');
    if (txt) txt.textContent = tr('mco.selectServer.popup', txt.textContent);
  }

  renderList();
  applyI18nTitles();

  if (window.i18n && window.i18n.ready) {
    window.i18n.ready(function() { renderList(); applyI18nTitles(); });
  }
  document.addEventListener('i18n-ready', function() { renderList(); applyI18nTitles(); });
})();
</script>

</body>
</html>
